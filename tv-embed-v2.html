<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BBK TV Vorschau</title>
<style>
:root{--orange:#F08000;--dark:#0d121a;--dark2:#151d29;--text:#fff;--muted:#9aa5b4;--border:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:transparent;color:var(--text)}
.wrap{background:linear-gradient(135deg,#101721,#0a0f16);border:1px solid var(--border);border-radius:16px;padding:18px;overflow:hidden}
.head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.logo-img{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:12px;padding:4px}
.head h2{font-size:22px}.head p{font-size:12px;color:var(--muted);margin-top:2px}
.open{background:var(--orange);color:white;text-decoration:none;padding:10px 14px;border-radius:9px;font-size:13px;font-weight:700;white-space:nowrap}
.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(240px,.8fr);gap:14px}
.player{background:#05080d;border-radius:13px;overflow:hidden;border:1px solid var(--border)}
.frame{position:relative;aspect-ratio:16/9;background:#05080d;display:flex;align-items:center;justify-content:center}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.placeholder{text-align:center;color:var(--muted);padding:20px}.placeholder b{display:block;color:white;font-size:18px;margin-top:8px}
.info{padding:12px 14px;background:var(--dark2)}
.type{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--orange);font-weight:800}
.title{font-size:16px;font-weight:800;margin-top:5px;line-height:1.3}
.meta{font-size:11px;color:var(--muted);margin-top:5px}
.side{display:grid;grid-template-columns:1fr;gap:9px}
.item{display:grid;grid-template-columns:108px 1fr;gap:10px;background:var(--dark2);border:1px solid var(--border);border-radius:11px;padding:8px;cursor:pointer;color:white;text-align:left}
.item:hover{border-color:rgba(240,128,0,.65)}
.thumb{aspect-ratio:16/9;border-radius:7px;background:#222 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--orange);font-size:24px;overflow:hidden}
.item h3{font-size:12px;line-height:1.3}.item p{font-size:10px;color:var(--muted);margin-top:4px}
.spot{position:absolute;inset:0;z-index:5;background:radial-gradient(circle at 50% 35%,rgba(240,128,0,.22),transparent 35%),linear-gradient(135deg,#080b10,#182230);display:none;align-items:center;justify-content:center;text-align:center;padding:20px}
.spot.show{display:flex}.spot-inner{max-width:440px}.spot img{width:118px;height:118px;object-fit:contain;background:#fff;border-radius:18px;padding:8px;margin-bottom:16px}.spot h3{font-size:26px}.spot p{color:#c5cbd3;font-size:14px;margin-top:7px}.count{color:var(--orange);font-weight:800;margin-top:16px;font-size:15px}
.status{font-size:12px;color:var(--muted);padding:10px}
@media(max-width:780px){.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.item{grid-template-columns:1fr}.item .thumb{width:100%}}
@media(max-width:520px){.wrap{padding:12px}.head{align-items:flex-start}.head p{display:none}.open{padding:9px 10px}.side{grid-template-columns:1fr}.logo-img{width:48px;height:48px}}
</style>
</head>
<body>
<section class="wrap">
  <div class="head">
    <div class="brand">
      <img class="logo-img" src="https://bbk-basketball.netlify.app/bbk-logo.png" alt="BBK Logo">
      <div><h2>BBK TV</h2><p>Highlights · Interviews · Vereinsvideos</p></div>
    </div>
    <a class="open" href="https://bbk-basketball.netlify.app/index-tv-v3.html" target="_blank" rel="noopener">Alle Videos →</a>
  </div>

  <div class="layout">
    <article class="player">
      <div class="frame" id="frame">
        <div class="spot" id="spot">
          <div class="spot-inner">
            <img src="https://bbk-basketball.netlify.app/bbk-logo.png" alt="BBK">
            <h3>Vereins-App powered by ONLANG</h3>
            <p>Der digitale Videokanal für Basketball im Kreis</p>
            <div class="count">Video startet in <span id="count">5</span> Sekunden</div>
          </div>
        </div>
        <div class="placeholder" id="placeholder">▶<b>Video auswählen</b></div>
      </div>
      <div class="info">
        <div class="type" id="type">BBK TV</div>
        <div class="title" id="title">Aktuelle Videos aus dem Basketballkreis</div>
        <div class="meta" id="meta">Düsseldorf/Neuss</div>
      </div>
    </article>
    <div class="side" id="list"><div class="status">Videos werden geladen …</div></div>
  </div>
</section>

<script>
const API="https://script.google.com/macros/s/AKfycbxBSy3EwXtbxD3_ecN_4p4LAtZ_mrpqT4S6LsP70VZ9yu-q-jxR9hjTf37jGuXjA00rZg/exec";
let videos=[];

function ytId(url){
  const m=String(url||"").match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([^?&/\s]+)/i);
  return m?m[1]:"";
}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

async function loadVideos(){
  try{
    const r=await fetch(API+"?action=news");
    const j=await r.json();
    const rows=(j.status==="ok"&&Array.isArray(j.data))?j.data:[];
    videos=rows.map((n,i)=>({
      id:i+1,
      title:(n.Titel||n.titel||"BBK Video").trim(),
      club:(n.Verein||n.verein||"BBK Düsseldorf/Neuss").trim(),
      date:(n.Datum||n.datum||"").trim(),
      type:(n.Kategorie||n.kategorie||"Video").trim(),
      youtube:(n.YouTube||n.youtube||"").trim(),
      image:(n.Bild||n.bild||"").trim()
    })).filter(v=>ytId(v.youtube));

    if(!videos.length){
      videos=[{id:1,title:"BBK TV – Basketball im Kreis",club:"BBK Düsseldorf/Neuss",date:"Test",type:"BBK TV",youtube:"",image:""}];
    }
    const originals=[...videos];
    while(videos.length<4) videos.push({...originals[videos.length%originals.length],id:videos.length+1});
    render();
    play(0);
  }catch(e){
    document.getElementById("list").innerHTML='<div class="status">Videos konnten gerade nicht geladen werden.</div>';
  }
}

function render(){
  document.getElementById("list").innerHTML=videos.slice(0,4).map((v,i)=>{
    const id=ytId(v.youtube);
    const bg=v.image|| (id?`https://img.youtube.com/vi/${id}/hqdefault.jpg`:"");
    return `<button class="item" onclick="play(${i})">
      <div class="thumb" style="${bg?`background-image:url('${esc(bg)}')`:''}">${bg?"":"▶"}</div>
      <div><h3>${esc(v.title)}</h3><p>${esc(v.club)}${v.date?" · "+esc(v.date):""}</p></div>
    </button>`;
  }).join("");
}

function play(i){
  const v=videos[i]; if(!v)return;
  document.getElementById("type").textContent=v.type||"Video";
  document.getElementById("title").textContent=v.title;
  document.getElementById("meta").textContent=(v.club||"BBK")+(v.date?" · "+v.date:"");
  const id=ytId(v.youtube);
  const frame=document.getElementById("frame");
  frame.querySelector("iframe")?.remove();
  const ph=document.getElementById("placeholder");

  if(!id){
    ph.style.display="block";
    ph.innerHTML="▶<b>"+esc(v.title)+"</b>";
    return;
  }
  showSpot(()=>{
    ph.style.display="none";
    const f=document.createElement("iframe");
    f.src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0`;
    f.allow="autoplay; encrypted-media; picture-in-picture";
    f.allowFullscreen=true;
    frame.appendChild(f);
  });
}

function showSpot(done){
  const spot=document.getElementById("spot");
  const count=document.getElementById("count");
  let n=5; count.textContent=n; spot.classList.add("show");
  const timer=setInterval(()=>{
    n--; count.textContent=Math.max(n,0);
    if(n<=0){clearInterval(timer);spot.classList.remove("show");done()}
  },1000);
}
loadVideos();
</script>
</body>
</html>
